name: Keep App Alive

on:
  schedule:
    # Runs every 2 days at 8:00 AM UTC
    - cron: '0 8 */2 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Application
        run: |
          echo "Pinging application to keep it alive..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://aypheneventplanner.vercel.app)
          echo "Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ App is alive and responding!"
          else
            echo "⚠️ App returned status $HTTP_STATUS"
          fi

      - name: Ping API Health
        run: |
          echo "Checking API health..."
          curl -s https://aypheneventplanner.vercel.app/api/health || echo "No health endpoint, but main page was pinged"
